server:
  port: 8080

spring:
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: false

      routes:
        - id: user-service-public
          uri: http://localhost:8050
          predicates:
            - Path=/api/auth/**

        - id: user-service-secured
          uri: http://localhost:8050
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuth

        - id: care-service
          uri: http://localhost:5005
          predicates:
            - Path=/api/care/**
          filters:
            - name: JwtAuth

        - id: ehr-service
          uri: http://localhost:5006
          predicates:
            - Path=/api/ehr/**
          filters:
            - name: JwtAuth

        - id: audit-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/audit/**
            - Path=/api/admin/alerts/**
          filters:
            - name: JwtAuth

gateway:
  jwt:
    issuer: "identity-service"
    audience: "your-audience"
    secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"
    clockSkewSeconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
