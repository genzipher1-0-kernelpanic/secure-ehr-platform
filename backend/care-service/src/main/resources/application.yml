server:
  port: 5005

spring:
  application:
    name: care-service
  datasource:
    url: ${CARE_DB_URL:jdbc:mysql://localhost:3306/care_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CARE_DB_USERNAME:root}
    password: ${CARE_DB_PASSWORD:mapa}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.web: INFO

kafka:
  topics:
    patientAssign: ${KAFKA_TOPIC_PATIENT_ASSIGN:patient-assign}
    userRegistered: ${KAFKA_TOPIC_USER_REGISTERED:user-registered}
    auditEvents: ${KAFKA_TOPIC_AUDIT_EVENTS:audit-events}

ehr:
  service:
    baseUrl: ${EHR_SERVICE_URL:http://localhost:5006}
    internalToken: ${EHR_INTERNAL_TOKEN:ehr}

jwt:
  issuer: "genzipher-identity"
  secret: "Ro7m3HxWZlse6kmdCNsGJXZr570I0in3NEF5Fr8UzziDJqqMn1yL7eYpXlB"
  clockSkewSeconds: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
